<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanGrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b0f;--surf:#0d1117;--card:#111827;--card2:#0d1420;--bord:#1c2a3a;
  --pass:#16a34a;--pass-l:rgba(22,163,74,.12);
  --fail:#dc2626;--fail-l:rgba(220,38,38,.12);
  --brand:#ef4444;--brand-l:rgba(239,68,68,.1);--brand-b:rgba(239,68,68,.28);
  --grad:linear-gradient(135deg,#16a34a 0%,#ef4444 100%);
  --grad-l:linear-gradient(135deg,rgba(22,163,74,.14) 0%,rgba(239,68,68,.14) 100%);
  --warn:#d97706;--warn-l:rgba(217,119,6,.12);
  --txt:#e2e8f0;--mut:#7c8aa0;--wh:#f8fafc;
}
html,body{min-height:100vh;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt)}
button,input,textarea,select{font-family:inherit}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#1c2a3a;border-radius:8px}
.hidden{display:none!important}
i.ti{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;flex-shrink:0;vertical-align:-0.15em}
i.ti svg{width:100%;height:100%;display:block}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 0%,rgba(239,68,68,.10),transparent);pointer-events:none}
.login-card{background:var(--surf);border:1px solid var(--bord);border-radius:16px;padding:34px;width:100%;max-width:392px;position:relative;z-index:2}
.brand{font-family:'Syne',sans-serif;font-size:23px;font-weight:800;color:var(--wh);display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:6px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--grad)}
.login-sub{font-size:12.5px;color:var(--mut);text-align:center;margin-bottom:26px}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.role-tab{background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--mut);font-size:12.5px;transition:all .15s}
.role-tab i{font-size:18px}
.role-tab.active{border-color:#22b35e;color:var(--wh);background:var(--grad-l)}
.fi{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fl{font-size:11.5px;color:var(--mut);font-weight:500}
.inp{background:var(--card);border:1px solid var(--bord);border-radius:8px;padding:11px 13px;color:var(--txt);font-size:14px;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:#22b35e;box-shadow:0 0 0 3px rgba(34,179,94,.12)}
.pwd-wrap{position:relative}
.pwd-eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--mut);cursor:pointer;font-size:15px}
.btn{background:var(--grad);border:none;color:#fff;font-size:14px;font-weight:600;padding:12px;border-radius:8px;cursor:pointer;width:100%;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid var(--bord);color:var(--txt);font-size:13px;font-weight:500;padding:10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-outline:hover{border-color:#22b35e;color:#22b35e}
.errmsg{font-size:12px;color:var(--fail);text-align:center;margin-top:6px;min-height:16px}
.okmsg{font-size:12px;color:var(--pass);text-align:center;margin-top:6px;min-height:16px}

.app{display:none;min-height:100vh}
.app.show{display:flex}
.sidebar{width:220px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--bord);display:flex;flex-direction:column;padding:18px 14px}
.sb-brand{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--wh);display:flex;align-items:center;gap:8px;padding:6px 8px 20px}
.sb-brand .dot{width:8px;height:8px;border-radius:50%;background:var(--grad)}
.sb-nav{display:flex;flex-direction:column;gap:3px;flex:1}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--mut);font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s;position:relative}
.sb-item i{font-size:17px;width:18px;text-align:center}
.sb-item:hover{background:rgba(255,255,255,.03);color:var(--txt)}
.sb-item.active{background:var(--grad-l);color:var(--wh)}
.sb-item.active::before{content:'';position:absolute;left:-14px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--grad)}
.sb-foot{border-top:1px solid var(--bord);padding-top:12px;margin-top:8px}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--bord);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--brand);flex-shrink:0}
.sb-uname{font-size:12.5px;font-weight:600;color:var(--wh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-urole{font-size:10.5px;color:var(--mut)}
.sb-logout{width:100%;margin-top:8px;background:transparent;border:1px solid var(--bord);color:var(--mut);font-size:12px;padding:8px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sb-logout:hover{border-color:var(--fail);color:var(--fail)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--bord);flex-shrink:0}
.tb-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;color:var(--wh)}
.tb-sub{font-size:12px;color:var(--mut);margin-top:2px}
.menu-btn{display:none;background:var(--card);border:1px solid var(--bord);color:var(--txt);width:34px;height:34px;border-radius:8px;align-items:center;justify-content:center;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:24px 28px 60px}

.card{background:var(--card2);border:1px solid var(--bord);border-radius:14px;padding:20px}
.card-h{font-size:15px;font-weight:700;color:var(--wh);display:flex;align-items:center;gap:8px;margin-bottom:3px}
.card-sub{font-size:12px;color:var(--mut);margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--card2);border:1px solid var(--bord);border-radius:12px;padding:16px 18px}
.stat b{display:block;font-family:'Syne',sans-serif;font-size:24px;color:var(--wh)}
.stat span{font-size:11.5px;color:var(--mut)}

.upload-box{border:1.5px dashed var(--bord);border-radius:12px;padding:26px 14px;text-align:center;cursor:pointer;transition:border-color .15s;position:relative}
.upload-box:hover{border-color:var(--brand)}
.upload-box i{font-size:22px;color:var(--mut)}
.upload-box .ut{font-size:13px;color:var(--txt);margin-top:8px}
.upload-box .us{font-size:11px;color:var(--mut);margin-top:3px}
.upload-box.filled{border-style:solid;border-color:var(--pass);background:var(--pass-l)}
.upload-box.filled .ut{color:var(--pass)}

textarea.inp{resize:vertical;min-height:88px;line-height:1.5;font-size:13px}
.chip-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;background:var(--card);border:1px solid var(--bord);color:var(--mut);padding:5px 10px;border-radius:20px;cursor:pointer}
.chip:hover{border-color:#22b35e;color:#22b35e}

.badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-block}
.badge.g{background:var(--pass-l);color:var(--pass)}
.badge.r{background:var(--fail-l);color:var(--fail)}
.badge.n{background:rgba(255,255,255,.06);color:var(--mut)}

.row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--bord)}
.row:last-child{border-bottom:none}
.row-name{font-size:13.5px;font-weight:600;color:var(--wh)}
.row-sub{font-size:11.5px;color:var(--mut);margin-top:2px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surf);border:1px solid var(--bord);border-radius:14px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-h{font-size:16px;font-weight:700;color:var(--wh);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{cursor:pointer;color:var(--mut);font-size:20px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--card);border:1px solid var(--bord);border-left:3px solid var(--pass);color:var(--wh);padding:12px 18px;border-radius:9px;font-size:13px;z-index:200;transition:transform .25s;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{border-left-color:var(--fail)}

.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.result-score{font-family:'Syne',sans-serif;font-size:38px;font-weight:800;color:var(--wh)}
.qrow{background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.qrow-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--wh)}
.qrow-fb{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.5}

.cam-video{width:100%;border-radius:10px;background:#000}
.cam-actions{display:flex;gap:10px;margin-top:12px}

@media(max-width:860px){
  .grid3{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:90;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .content{padding:18px 16px 60px}
  .topbar{padding:14px 16px}
}
</style>
<script src="config.js"></script>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="brand"><span class="dot"></span>ScanGrade</div>
    <div class="login-sub">Sign in to continue</div>
    <div class="role-tabs" id="role-tabs">
      <div class="role-tab active" data-role="admin"><i class="ti ti-shield"></i>Admin</div>
      <div class="role-tab" data-role="teacher"><i class="ti ti-teacher"></i>Teacher</div>
      <div class="role-tab" data-role="student"><i class="ti ti-school"></i>Student</div>
    </div>
    <div class="fi">
      <label class="fl">Email address</label>
      <input class="inp" id="login-email" type="email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="fi">
      <label class="fl">Password</label>
      <div class="pwd-wrap">
        <input class="inp" id="login-pwd" type="password" placeholder="Enter your password" autocomplete="current-password" style="padding-right:38px">
        <i class="ti ti-eye pwd-eye" id="login-pwd-eye"></i>
      </div>
    </div>
    <button class="btn" id="login-btn"><i class="ti ti-login-2"></i>Sign in</button>
    <div class="errmsg" id="login-err"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="sidebar" id="sidebar">
    <div class="sb-brand"><span class="dot"></span>ScanGrade</div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="avatar" id="sb-avatar">A</div>
        <div style="min-width:0">
          <div class="sb-uname" id="sb-uname">—</div>
          <div class="sb-urole" id="sb-urole">—</div>
        </div>
      </div>
      <button class="sb-logout" id="logout-btn"><i class="ti ti-logout"></i>Sign out</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="menu-btn" id="menu-btn"><i class="ti ti-menu-2"></i></div>
        <div>
          <div class="tb-title" id="tb-title">Overview</div>
          <div class="tb-sub" id="tb-sub"></div>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toast-msg"></span></div>
<canvas id="cam-canvas" class="hidden"></canvas>

<script>
/* ============================================================
   Icon system — inline SVG, zero external dependency
   ============================================================ */
const ICONS = {
  shield: '<path d="M12 3l7 3.5V11c0 4.8-3.2 8.3-7 9.5-3.8-1.2-7-4.7-7-9.5V6.5z"/>',
  teacher: '<circle cx="12" cy="13.5" r="3.4"/><path d="M7.8 8.6L12 5.2l4.2 3.4-4.2 1.9z"/><path d="M4.5 20.5c0-3.4 3-5.7 7.5-5.7s7.5 2.3 7.5 5.7"/>',
  school: '<path d="M12 3L2 8l10 5 10-5-10-5z"/><path d="M6 10.5V16c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5.5"/>',
  eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.7"/>',
  'eye-off': '<path d="M3 3l18 18"/><path d="M10.6 5.7A10.7 10.7 0 0112 5.5c6.4 0 10 6.5 10 6.5a15.7 15.7 0 01-3.3 4"/><path d="M6.6 6.7C4 8.4 2 12 2 12s3.6 6.5 10 6.5c1.4 0 2.7-.3 3.8-.7"/><path d="M9.5 9.9a2.7 2.7 0 003.8 3.8"/>',
  'login-2': '<path d="M14 3h5a2 2 0 012 2v14a2 2 0 01-2 2h-5"/><path d="M10 16l5-4-5-4"/><path d="M15 12H3"/>',
  logout: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/>',
  'menu-2': '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.3 1.9"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
  check: '<polyline points="4 12.5 9.5 18 20 6.5"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 8.3a3 3 0 110 5.9"/><path d="M17 14.2c2.5.5 4.5 2.5 4.5 5.8"/>',
  tool: '<path d="M14.7 6.3a4 4 0 11-5.4 5.4L4 17l3 3 5.7-5.7a4 4 0 015.4-5.4z"/>',
  search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.65 1.65 0 00-1.8-.3 1.65 1.65 0 00-1 1.5V21a2 2 0 01-4 0v-.1A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.65 1.65 0 00.3-1.8 1.65 1.65 0 00-1.5-1H3a2 2 0 010-4h.1A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.65 1.65 0 001.8.3H9a1.65 1.65 0 001-1.5V3a2 2 0 014 0v.1a1.65 1.65 0 001 1.5 1.65 1.65 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.65 1.65 0 00-.3 1.8V9a1.65 1.65 0 001.5 1H21a2 2 0 010 4h-.1a1.65 1.65 0 00-1.5 1z"/>',
  language: '<circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9s1.3-6.5 3.8-9z"/>',
  'file-text': '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>',
  key: '<circle cx="7.5" cy="15.5" r="4.2"/><path d="M10.6 12.4L20 3"/><path d="M16 7l3 3"/><path d="M13.3 9.7l2.5 2.5"/>',
  scan: '<path d="M4 8V5a1 1 0 011-1h3"/><path d="M20 8V5a1 1 0 00-1-1h-3"/><path d="M4 16v3a1 1 0 001 1h3"/><path d="M20 16v3a1 1 0 01-1 1h-3"/>',
  camera: '<path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  sparkles: '<path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
  'chart-bar': '<line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="13" width="3" height="7"/><rect x="11" y="9" width="3" height="11"/><rect x="16" y="5" width="3" height="15"/>'
};
function hydrateIcons(root){
  root.querySelectorAll('i.ti').forEach(el=>{
    if(el.dataset.hydrated) return;
    const cls = Array.from(el.classList).find(c=>c.startsWith('ti-'));
    if(!cls) return;
    const inner = ICONS[cls.slice(3)];
    if(!inner) return;
    el.dataset.hydrated = '1';
    el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  });
}
new MutationObserver(()=>hydrateIcons(document.body)).observe(document.body, {childList:true, subtree:true});
hydrateIcons(document.body);

/* ============================================================
   API client — talks to the separate backend (see config.js)
   ============================================================ */
const API_BASE = (window.SCANGRADE_API_BASE || 'http://localhost:3000').replace(/\/$/, '');
if (location.protocol === 'https:' && API_BASE.startsWith('http://')) {
  console.error('ScanGrade: this page is loaded over HTTPS but config.js points at an HTTP backend (' + API_BASE + '). Browsers block this — update SCANGRADE_API_BASE in config.js to your backend\'s https:// URL.');
}
let authToken = localStorage.getItem('sg_token') || null;
let currentUser = JSON.parse(localStorage.getItem('sg_user') || 'null');
let selectedRole = 'admin';

async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const res = await fetch(API_BASE + '/api' + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

function showToast(msg, isErr){
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.className = 'toast show'+(isErr?' err':'');
  setTimeout(()=>t.classList.remove('show'), 3200);
}
function initials(name){
  if(!name) return '?';
  const p = name.trim().split(/\s+/);
  return (p[0][0] + (p[1]?p[1][0]:'')).toUpperCase();
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){ return new Date(ts).toLocaleString(); }

/* ============================================================
   LOGIN
   ============================================================ */
document.querySelectorAll('.role-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.role-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');

async function doLogin(){
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pwd').value;
  const btn = document.getElementById('login-btn');
  if(!email || !password){ errEl.textContent = 'Enter your email and password.'; return; }

  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Signing in...';
  try{
    const data = await api('/auth/login', { method:'POST', body: JSON.stringify({email, password, role: selectedRole}) });
    authToken = data.token; currentUser = data.user;
    localStorage.setItem('sg_token', authToken);
    localStorage.setItem('sg_user', JSON.stringify(currentUser));
    enterApp();
  }catch(e){
    errEl.textContent = e.message;
  }finally{
    btn.disabled = false; btn.innerHTML = '<i class="ti ti-login-2"></i>Sign in';
  }
}
function doLogout(){
  authToken = null; currentUser = null;
  localStorage.removeItem('sg_token'); localStorage.removeItem('sg_user');
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-email').value = '';
  document.getElementById('login-pwd').value = '';
}
document.getElementById('logout-btn').addEventListener('click', doLogout);

});

const TITLES = {

function enterApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.add('show');
  document.getElementById('sb-avatar').textContent = initials(currentUser.name || currentUser.email);
  document.getElementById('sb-uname').textContent = currentUser.name || currentUser.email;
  document.getElementById('sb-urole').textContent = currentUser.role.charAt(0).toUpperCase()+currentUser.role.slice(1);
  renderNav();
  navigate(NAV[currentUser.role][0].id);
}
function renderNav(){
  const nav = document.getElementById('sb-nav');
  nav.innerHTML = NAV[currentUser.role].map(item=>
    `<div class="sb-item" data-view="${item.id}"><i class="ti ${item.icon}"></i>${item.label}</div>`
  ).join('');
  nav.querySelectorAll('.sb-item').forEach(el=>{
    el.addEventListener('click', ()=>{ navigate(el.dataset.view); document.getElementById('sidebar').classList.remove('open'); });
  });
}
async function navigate(view){
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('active', el.dataset.view===view));
  document.getElementById('tb-title').textContent = TITLES[view][0];
  document.getElementById('tb-sub').textContent = TITLES[view][1];
  const content = document.getElementById('content');
  content.innerHTML = '<div style="color:var(--mut);font-size:13px">Loading…</div>';
  const renderers = {
    overview: renderAdminOverview, teachers: renderAdminTeachers, security: renderAdminSecurity,
    grade: renderTeacherGrade, students: renderTeacherStudents,
    results: renderStudentResults, settings: renderSettings
  };
  try{ await renderers[view](); }
  catch(e){
    if(e.message.includes('Session expired') || e.message.includes('Not signed in')) doLogout();
    else content.innerHTML = `<div class="card" style="color:var(--fail);font-size:13px">${esc(e.message)}</div>`;
  }
}

function setupUploadBox(boxId, inputId, kind){
  const box = document.getElementById(boxId);
  const input = document.getElementById(inputId);
  box.addEventListener('click', ()=>input.click());
  input.addEventListener('change', ()=>{
    const f = input.files[0];

    if(f.size > 15*1024*1024){ showToast('File too large (max 15MB)', true); return; }
    gradeFiles[kind] = f;
    box.classList.add('filled');
    box.querySelector('.ut').textContent = f.name.length>22 ? f.name.slice(0,20)+'…' : f.name;
    box.querySelector('.us').textContent = 'Ready';
  });
}

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <div class="modal-h">Capture answer sheet <i class="ti ti-x modal-close" id="cam-close"></i></div>
      <video id="cam-video" class="cam-video" autoplay playsinline></video>
      <div class="cam-actions">
        <button class="btn" id="cam-shoot"><i class="ti ti-camera"></i>Capture</button>
        <button class="btn-outline" id="cam-cancel" style="width:auto;padding:12px 18px">Cancel</button>
      </div>
      <div class="errmsg" id="cam-err"></div>
    </div>`;
  document.body.appendChild(bg);
  const video = bg.querySelector('#cam-video');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false})
    .then(stream=>{ camStream = stream; video.srcObject = stream; })
    .catch(err=>{ bg.querySelector('#cam-err').textContent = 'Camera permission denied or unavailable: '+err.message; });
  function closeCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } bg.remove(); }
  bg.querySelector('#cam-close').addEventListener('click', closeCam);
  bg.querySelector('#cam-cancel').addEventListener('click', closeCam);
  bg.querySelector('#cam-shoot').addEventListener('click', ()=>{
    const canvas = document.getElementById('cam-canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    canvas.toBlob(blob=>{
      gradeFiles.sheet = new File([blob], 'camera-capture.jpg', {type:'image/jpeg'});
      const box = document.getElementById('box-sheet');
      box.classList.add('filled');
      box.querySelector('.ut').textContent = 'Camera capture';
      box.querySelector('.us').textContent = 'Ready';
      showToast('Answer sheet captured');
    }, 'image/jpeg', 0.92);
    closeCam();
  });
}
async function runGrading(){
  const btn = document.getElementById('grade-btn');
  const resultBox = document.getElementById('grade-result');
  if(!gradeFiles.sheet){ showToast('Upload or capture the answer sheet first', true); return; }
  const instructions = document.getElementById('grade-instructions').value.trim();
  const roll = document.getElementById('grade-roll').value.trim();
  const subject = document.getElementById('grade-subject').value.trim() || 'Exam';

  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Grading…';
  resultBox.innerHTML = '<div class="card" style="text-align:center;color:var(--mut);font-size:13px">Reading the answer sheet and comparing against the answer key…</div>';
  try{
    const form = new FormData();
    if(gradeFiles.qb) form.append('qb', gradeFiles.qb);
    if(gradeFiles.key) form.append('key', gradeFiles.key);
    form.append('sheet', gradeFiles.sheet);
    form.append('instructions', instructions);
    form.append('subject', subject);
    form.append('rollNo', roll);
    const { result } = await api('/grade', { method:'POST', body: form });
    renderGradeResult(result, subject);
    if(roll) showToast('Result saved for roll '+roll.toUpperCase());
  }catch(e){
    resultBox.innerHTML = `<div class="card" style="color:var(--fail);font-size:13px">Could not grade this sheet: ${esc(e.message)}</div>`;
  }finally{
    btn.disabled = false; btn.innerHTML = '<i class="ti ti-sparkles"></i>Grade with AI';
  }
}
function renderGradeResult(r, subject){
  const pct = r.totalMarks ? Math.round((r.totalObtained/r.totalMarks)*100) : 0;
  const qHtml = (r.questions||[]).map(q=>`
    <div class="qrow"><div class="qrow-top"><span>Q${esc(q.qNo)}</span><span>${q.obtained}/${q.outOf}</span></div><div class="qrow-fb">${esc(q.feedback||'')}</div></div>`).join('');
  document.getElementById('grade-result').innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px">
        <div><div class="card-h" style="margin-bottom:2px">${esc(subject)}</div><div class="card-sub" style="margin-bottom:0">${esc(r.overallFeedback||'')}</div></div>
        <div style="text-align:right">
          <div class="result-score">${r.totalObtained}<span style="font-size:18px;color:var(--mut)">/${r.totalMarks}</span></div>
          <span class="badge ${r.passed?'g':'r'}">${r.passed?'PASS':'FAIL'} · ${pct}%</span>
        </div>
      </div>
      <div style="margin-top:16px">${qHtml}</div>
    </div>`;
}

/* ============================================================
   STUDENT
   ============================================================ */
async function renderStudentResults(){
  const { results } = await api('/student/results');
  const content = document.getElementById('content');
  if(results.length===0){ content.innerHTML = '<div class="card" style="text-align:center;color:var(--mut);font-size:13px">No graded results yet.</div>'; return; }
  content.innerHTML = results.map(r=>{
    const pct = r.totalMarks ? Math.round((r.totalObtained/r.totalMarks)*100) : 0;
    const qHtml = (r.questions||[]).map(q=>`
      <div class="qrow"><div class="qrow-top"><span>Q${esc(q.qNo)}</span><span>${q.obtained}/${q.outOf}</span></div><div class="qrow-fb">${esc(q.feedback||'')}</div></div>`).join('');
    return `<div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px">
        <div><div class="card-h" style="margin-bottom:2px">${esc(r.subject)}</div><div class="card-sub" style="margin-bottom:0">${fmtTime(r.gradedAt)} · ${esc(r.overallFeedback||'')}</div></div>
        <div style="text-align:right">
          <div class="result-score">${r.totalObtained}<span style="font-size:16px;color:var(--mut)">/${r.totalMarks}</span></div>
          <span class="badge ${r.passed?'g':'r'}">${r.passed?'PASS':'FAIL'} · ${pct}%</span>
        </div>
      </div>
      <div style="margin-top:14px">${qHtml}</div>
    </div>`;
  }).join('');
}

/* ============================================================
   SETTINGS
   ============================================================ */
async function renderSettings(){
  document.getElementById('content').innerHTML = `
    <div class="card" style="max-width:420px">
      <div class="card-h"><i class="ti ti-lock"></i>Change password</div>
      <div class="card-sub">Update the password for ${esc(currentUser.email)}</div>
      <div class="fi"><label class="fl">Current password</label><input class="inp" type="password" id="cp-cur"></div>
      <div class="fi"><label class="fl">New password</label><input class="inp" type="password" id="cp-new" placeholder="Minimum 8 characters"></div>
      <div class="fi"><label class="fl">Confirm new password</label><input class="inp" type="password" id="cp-conf"></div>
      <div class="errmsg" id="cp-err"></div>
      <div class="okmsg" id="cp-ok"></div>
      <button class="btn" id="cp-save"><i class="ti ti-check"></i>Update password</button>
    </div>`;
  document.getElementById('cp-save').addEventListener('click', async ()=>{
    const err = document.getElementById('cp-err'), ok = document.getElementById('cp-ok');
    err.textContent=''; ok.textContent='';
    const newPwd = document.getElementById('cp-new').value;
    const conf = document.getElementById('cp-conf').value;
    if(newPwd !== conf){ err.textContent = 'Passwords do not match.'; return; }
    try{
      await api('/auth/change-password', { method:'POST', body: JSON.stringify({
        currentPassword: document.getElementById('cp-cur').value, newPassword: newPwd
      })});
      ok.textContent = 'Password updated.';
      document.getElementById('cp-cur').value = document.getElementById('cp-new').value = document.getElementById('cp-conf').value = '';
    }catch(e){ err.textContent = e.message; }
  });
}

/* ============================================================
   BOOT — resume session if a token is already saved
   ============================================================ */
if(authToken && currentUser){ enterApp(); }
