<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanGrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#200E01;--wine:#5B0202;--crimson:#8B0000;--parch:#EDE7C7;
  --ink-a08:rgba(32,14,1,.08);--ink-a15:rgba(32,14,1,.15);--ink-a40:rgba(32,14,1,.4);--ink-a65:rgba(32,14,1,.65);
  --wine-a20:rgba(91,2,2,.2);--wine-a40:rgba(91,2,2,.45);--wine-a70:rgba(91,2,2,.7);
  --crim-a10:rgba(139,0,0,.1);--crim-a18:rgba(139,0,0,.18);--crim-a35:rgba(139,0,0,.35);
  --parch-a08:rgba(237,231,199,.08);--parch-a15:rgba(237,231,199,.15);--parch-a30:rgba(237,231,199,.32);--parch-a55:rgba(237,231,199,.55);
}
html,body{min-height:100vh;font-family:'Quicksand',sans-serif;background:var(--ink);color:var(--parch);font-weight:500}
button,input,textarea,select{font-family:inherit}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--wine);border-radius:8px}
.hidden{display:none!important}
i.ti{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;flex-shrink:0;vertical-align:-0.15em}
i.ti svg{width:100%;height:100%;display:block}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

/* ---------- signature element: the seal ---------- */
.seal{border-radius:50%;background:radial-gradient(circle at 34% 30%, var(--crimson), var(--wine) 75%);position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 1px var(--parch-a30), inset 0 0 0 1px var(--ink-a40)}
.seal::before{content:'';position:absolute;inset:-6px;border-radius:50%;background:repeating-conic-gradient(var(--parch-a30) 0deg 6deg, transparent 6deg 14deg);opacity:.55;mask:radial-gradient(circle, transparent 70%, #000 71%, #000 100%);-webkit-mask:radial-gradient(circle, transparent 70%, #000 71%, #000 100%);animation:seal-spin 14s linear infinite}
@keyframes seal-spin{to{transform:rotate(360deg)}}
.seal-mark{width:52%;height:52%;color:var(--parch);position:relative;z-index:1}
.seal-mark svg{width:100%;height:100%;display:block}
.seal-mono{font-family:'Quicksand',sans-serif;font-weight:700;color:var(--parch);letter-spacing:.02em}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:
  radial-gradient(ellipse 70% 55% at 50% -10%, var(--wine-a40), transparent 60%), var(--ink)}
.login-card{background:var(--parch);border-radius:6px;padding:40px 38px 34px;width:100%;max-width:400px;position:relative;z-index:2;box-shadow:0 30px 70px var(--ink-a65);border:1px solid var(--wine-a40)}
.login-card::before{content:'';position:absolute;inset:7px;border:1px solid var(--ink-a15);border-radius:3px;pointer-events:none}
.login-seal-wrap{display:flex;justify-content:center;margin-bottom:18px}
.login-seal{width:60px;height:60px}
.login-seal .seal-mono{font-size:19px}
.brand{font-family:'Quicksand',sans-serif;font-size:24px;font-weight:700;color:var(--ink);text-align:center;letter-spacing:.04em}
.brand-rule{width:36px;height:2px;background:var(--crimson);margin:10px auto 12px;border-radius:2px}
.login-sub{font-size:12px;color:var(--ink-a65);text-align:center;margin-bottom:28px;letter-spacing:.04em}
.fi{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fl{font-size:10.5px;color:var(--ink-a65);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.inp{background:transparent;border:none;border-bottom:1.5px solid var(--ink-a40);border-radius:0;padding:9px 2px;color:var(--ink);font-size:15px;outline:none;width:100%;transition:border-color .15s;font-family:inherit;font-weight:500}
.inp::placeholder{color:var(--ink-a40)}
.inp:focus{border-color:var(--crimson)}
.card .inp, .modal .inp{background:var(--parch);border:1px solid var(--ink-a15);border-radius:5px;padding:11px 13px}
.card .inp:focus, .modal .inp:focus{border-color:var(--crimson);box-shadow:0 0 0 3px var(--crim-a10)}
.pwd-wrap{position:relative}
.pwd-eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);color:var(--ink-a65);cursor:pointer;font-size:16px}
.btn{background:var(--crimson);border:1px solid var(--ink-a15);color:var(--parch);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:13px;border-radius:4px;cursor:pointer;width:100%;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--wine)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-outline{background:transparent;border:1.5px solid var(--ink-a40);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.06em;padding:10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;text-transform:uppercase}
.btn-outline:hover{border-color:var(--crimson);color:var(--crimson)}
.errmsg{font-size:12px;color:var(--crimson);text-align:center;margin-top:10px;min-height:16px;font-weight:600}
.okmsg{font-size:12px;color:var(--wine);text-align:center;margin-top:10px;min-height:16px;font-weight:600}

/* ---------- app shell ---------- */
.app{display:none;min-height:100vh}
.app.show{display:flex}
.sidebar{width:224px;flex-shrink:0;background:var(--ink);border-right:1px solid var(--parch-a08);display:flex;flex-direction:column;padding:22px 16px}
.sb-brand{display:flex;align-items:center;gap:10px;padding:4px 4px 22px}
.sb-seal{width:34px;height:34px}
.sb-seal .seal-mono{font-size:11px}
.sb-brand-txt{font-family:'Quicksand',sans-serif;font-weight:700;font-size:16px;color:var(--parch);letter-spacing:.03em}
.sb-nav{display:flex;flex-direction:column;gap:2px;flex:1;margin-top:6px}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:4px;color:var(--parch-a55);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;position:relative;letter-spacing:.02em}
.sb-item i{font-size:16px;width:18px;text-align:center}
.sb-item:hover{background:var(--parch-a08);color:var(--parch)}
.sb-item.active{background:var(--wine-a40);color:var(--parch)}
.sb-item.active::before{content:'';position:absolute;left:-16px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--crimson)}
.sb-foot{border-top:1px solid var(--parch-a08);padding-top:14px;margin-top:10px}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 4px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--wine-a40);border:1px solid var(--parch-a15);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--parch);flex-shrink:0}
.sb-uname{font-size:12.5px;font-weight:700;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-urole{font-size:10px;color:var(--parch-a55);letter-spacing:.08em;text-transform:uppercase}
.sb-logout{width:100%;margin-top:10px;background:transparent;border:1px solid var(--parch-a15);color:var(--parch-a55);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:9px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sb-logout:hover{border-color:var(--crimson);color:var(--parch)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--parch)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--ink-a15);flex-shrink:0;background:var(--parch)}
.tb-title{font-family:'Quicksand',sans-serif;font-size:21px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.tb-sub{font-size:11.5px;color:var(--ink-a65);margin-top:2px;letter-spacing:.03em}
.menu-btn{display:none;background:var(--ink);border:none;color:var(--parch);width:34px;height:34px;border-radius:4px;align-items:center;justify-content:center;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:28px 32px 64px}

.card{background:var(--parch);border:1px solid var(--ink-a15);border-radius:6px;padding:22px;box-shadow:0 2px 0 var(--ink-a08)}
.card-h{font-family:'Quicksand',sans-serif;font-size:15.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:3px;letter-spacing:.01em}
.card-sub{font-size:11.5px;color:var(--ink-a65);margin-bottom:18px;letter-spacing:.02em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{background:var(--ink);border-radius:6px;padding:18px 20px}
.stat b{display:block;font-family:'Quicksand',sans-serif;font-size:26px;color:var(--parch);font-weight:700}
.stat span{font-size:10.5px;color:var(--parch-a55);letter-spacing:.1em;text-transform:uppercase}

.upload-box{border:1.5px dashed var(--ink-a40);border-radius:6px;padding:28px 14px;text-align:center;cursor:pointer;transition:all .15s;position:relative;background:var(--ink-a08)}
.upload-box:hover{border-color:var(--crimson)}
.upload-box i{font-size:21px;color:var(--ink-a65)}
.upload-box .ut{font-size:12.5px;color:var(--ink);margin-top:9px;font-weight:600}
.upload-box .us{font-size:10.5px;color:var(--ink-a65);margin-top:3px;letter-spacing:.04em}
.upload-box.filled{border-style:solid;border-color:var(--crimson);background:var(--crim-a10)}
.upload-box.filled .ut{color:var(--crimson)}

textarea.inp{resize:vertical;min-height:88px;line-height:1.55;font-size:13px}
.chip-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:10.5px;background:transparent;border:1px solid var(--ink-a40);color:var(--ink-a65);padding:6px 11px;border-radius:20px;cursor:pointer;font-weight:600;letter-spacing:.02em}
.chip:hover{border-color:var(--crimson);color:var(--crimson)}

.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;letter-spacing:.08em;text-transform:uppercase}
.badge.g{background:var(--parch);color:var(--ink);border:1.5px solid var(--ink)}
.badge.r{background:var(--crimson);color:var(--parch)}
.badge.n{background:var(--ink-a08);color:var(--ink-a65)}

.row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--ink-a15)}
.row:last-child{border-bottom:none}
.row-name{font-size:13.5px;font-weight:700;color:var(--ink)}
.row-sub{font-size:11px;color:var(--ink-a65);margin-top:2px;letter-spacing:.02em}

.modal-bg{position:fixed;inset:0;background:var(--ink-a65);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--parch);border-radius:6px;padding:26px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;border:1px solid var(--wine-a40)}
.modal-h{font-family:'Quicksand',sans-serif;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.modal-close{cursor:pointer;color:var(--ink-a65);font-size:18px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);border:1px solid var(--parch-a15);border-left:3px solid var(--crimson);color:var(--parch);padding:13px 20px;border-radius:5px;font-size:13px;z-index:200;transition:transform .25s;max-width:90vw;font-weight:600}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{border-left-color:var(--crimson)}

.spin{width:15px;height:15px;border:2px solid var(--parch-a30);border-top-color:var(--parch);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* result certificate */
.cert{background:var(--ink);border-radius:6px;padding:26px;position:relative;overflow:hidden}
.cert::before{content:'';position:absolute;inset:8px;border:1px solid var(--parch-a15);border-radius:3px;pointer-events:none}
.cert-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.cert-meta-label{font-size:9.5px;color:var(--parch-a55);letter-spacing:.12em;text-transform:uppercase}
.cert-meta-val{font-size:13px;color:var(--parch);font-weight:700;margin-top:2px}
.cert-seal{width:84px;height:84px;flex-shrink:0}
.cert-seal .seal-mono{font-size:13px;line-height:1.1;text-align:center}
.cert-score{font-family:'Quicksand',sans-serif;font-size:22px;font-weight:700;color:var(--parch)}
.cert-score span{font-size:12px;color:var(--parch-a55);font-weight:600}
.qrow{background:var(--parch-a08);border:1px solid var(--parch-a15);border-radius:5px;padding:13px 15px;margin-bottom:8px}
.qrow-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--parch)}
.qrow-fb{font-size:12px;color:var(--parch-a55);margin-top:5px;line-height:1.55}

.cam-video{width:100%;border-radius:6px;background:#000}
.cam-actions{display:flex;gap:10px;margin-top:12px}

@media(max-width:860px){
  .grid3{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:90;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px var(--ink-a65)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .content{padding:20px 18px 64px}
  .topbar{padding:16px 18px}
  .cert-head{flex-direction:column}
}
</style>
<script src="config.js"></script>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-seal-wrap">
      <div class="seal login-seal"><span class="seal-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M5.5 8.5c-1.2.6-2 1.6-2 3 0 1.6 1.1 2.8 2.6 3.2-.2.5-.3 1-.3 1.6 0 1.7 1.4 3 3.2 3 .6 0 1.1-.1 1.6-.4.6.9 1.6 1.4 2.7 1.4"/><path d="M18.5 8.5c1.2.6 2 1.6 2 3 0 1.6-1.1 2.8-2.6 3.2.2.5.3 1 .3 1.6 0 1.7-1.4 3-3.2 3-.6 0-1.1-.1-1.6-.4"/></svg></span></div>
    </div>
    <div class="brand">ScanGrade</div>
    <div class="brand-rule"></div>
    <div class="login-sub">Sign in to your account</div>
    <div class="fi">
      <label class="fl">Email address</label>
      <input class="inp" id="login-email" type="email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="fi">
      <label class="fl">Password</label>
      <div class="pwd-wrap">
        <input class="inp" id="login-pwd" type="password" placeholder="Enter your password" autocomplete="current-password" style="padding-right:30px">
        <i class="ti ti-eye pwd-eye" id="login-pwd-eye"></i>
      </div>
    </div>
    <button class="btn" id="login-btn" style="margin-top:8px"><i class="ti ti-login-2"></i>Sign In</button>
    <div class="errmsg" id="login-err"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="seal sb-seal"><span class="seal-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M5.5 8.5c-1.2.6-2 1.6-2 3 0 1.6 1.1 2.8 2.6 3.2-.2.5-.3 1-.3 1.6 0 1.7 1.4 3 3.2 3 .6 0 1.1-.1 1.6-.4.6.9 1.6 1.4 2.7 1.4"/><path d="M18.5 8.5c1.2.6 2 1.6 2 3 0 1.6-1.1 2.8-2.6 3.2.2.5.3 1 .3 1.6 0 1.7-1.4 3-3.2 3-.6 0-1.1-.1-1.6-.4"/></svg></span></div>
      <div class="sb-brand-txt">ScanGrade</div>
    </div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="avatar" id="sb-avatar">A</div>
        <div style="min-width:0">
          <div class="sb-uname" id="sb-uname">—</div>
          <div class="sb-urole" id="sb-urole">—</div>
        </div>
      </div>
      <button class="sb-logout" id="logout-btn"><i class="ti ti-logout"></i>Sign Out</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="menu-btn" id="menu-btn"><i class="ti ti-menu-2"></i></div>
        <div>
          <div class="tb-title" id="tb-title">Overview</div>
          <div class="tb-sub" id="tb-sub"></div>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toast-msg"></span></div>
<canvas id="cam-canvas" class="hidden"></canvas>

<script>
/* ============================================================
   Icon system — inline SVG, zero external dependency
   ============================================================ */
const ICONS = {
  shield: '<path d="M12 3l7 3.5V11c0 4.8-3.2 8.3-7 9.5-3.8-1.2-7-4.7-7-9.5V6.5z"/>',
  teacher: '<circle cx="12" cy="13.5" r="3.4"/><path d="M7.8 8.6L12 5.2l4.2 3.4-4.2 1.9z"/><path d="M4.5 20.5c0-3.4 3-5.7 7.5-5.7s7.5 2.3 7.5 5.7"/>',
  school: '<path d="M12 3L2 8l10 5 10-5-10-5z"/><path d="M6 10.5V16c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5.5"/>',
  eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.7"/>',
  'eye-off': '<path d="M3 3l18 18"/><path d="M10.6 5.7A10.7 10.7 0 0112 5.5c6.4 0 10 6.5 10 6.5a15.7 15.7 0 01-3.3 4"/><path d="M6.6 6.7C4 8.4 2 12 2 12s3.6 6.5 10 6.5c1.4 0 2.7-.3 3.8-.7"/><path d="M9.5 9.9a2.7 2.7 0 003.8 3.8"/>',
  'login-2': '<path d="M14 3h5a2 2 0 012 2v14a2 2 0 01-2 2h-5"/><path d="M10 16l5-4-5-4"/><path d="M15 12H3"/>',
  logout: '<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/>',
  'menu-2': '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.3 1.9"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
  check: '<polyline points="4 12.5 9.5 18 20 6.5"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 8.3a3 3 0 110 5.9"/><path d="M17 14.2c2.5.5 4.5 2.5 4.5 5.8"/>',

function hydrateIcons(root){
  root.querySelectorAll('i.ti').forEach(el=>{
    if(el.dataset.hydrated) return;
    const cls = Array.from(el.classList).find(c=>c.startsWith('ti-'));
    if(!cls) return;
    const inner = ICONS[cls.slice(3)];
    if(!inner) return;
    el.dataset.hydrated = '1';
    el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  });
}
new MutationObserver(()=>hydrateIcons(document.body)).observe(document.body, {childList:true, subtree:true});

/* ============================================================
   API client — talks to the separate backend (see config.js)
   ============================================================ */
const API_BASE = (window.SCANGRADE_API_BASE || 'http://localhost:3000').replace(/\/$/, '');
if (location.protocol === 'https:' && API_BASE.startsWith('http://')) {
  console.error('ScanGrade: this page is loaded over HTTPS but config.js points at an HTTP backend (' + API_BASE + '). Browsers block this — update SCANGRADE_API_BASE in config.js to your backend\'s https:// URL.');
}
let authToken = localStorage.getItem('sg_token') || null;
let currentUser = JSON.parse(localStorage.getItem('sg_user') || 'null');

async function api(path, opts = {}) {
  const headers = opts.headers || {};
  if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const res = await fetch(API_BASE + '/api' + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

function showToast(msg, isErr){
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.className = 'toast show'+(isErr?' err':'');
  setTimeout(()=>t.classList.remove('show'), 3200);
}
function initials(name){
  if(!name) return '?';
  const p = name.trim().split(/\s+/);
  return (p[0][0] + (p[1]?p[1][0]:'')).toUpperCase();
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){ return new Date(ts).toLocaleString(); }

async function doLogin(){
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pwd').value;
  const btn = document.getElementById('login-btn');
  if(!email || !password){ errEl.textContent = 'Enter your email and password.'; return; }

  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Signing In…';
  try{
    const data = await api('/auth/login', { method:'POST', body: JSON.stringify({email, password}) });
    authToken = data.token; currentUser = data.user;
    localStorage.setItem('sg_token', authToken);
    localStorage.setItem('sg_user', JSON.stringify(currentUser));
    enterApp();
  }catch(e){
    errEl.textContent = e.message;
  }finally{
    btn.disabled = false; btn.innerHTML = '<i class="ti ti-login-2"></i>Sign In';
  }
}
function doLogout(){
  authToken = null; currentUser = null;
  localStorage.removeItem('sg_token'); localStorage.removeItem('sg_user');
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-email').value = '';
  document.getElementById('login-pwd').value = '';
}

function enterApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.add('show');
  document.getElementById('sb-avatar').textContent = initials(currentUser.name || currentUser.email);
  document.getElementById('sb-uname').textContent = currentUser.name || currentUser.email;
  document.getElementById('sb-urole').textContent = currentUser.role.charAt(0).toUpperCase()+currentUser.role.slice(1);
  renderNav();

function renderNav(){
  const nav = document.getElementById('sb-nav');
  nav.innerHTML = NAV[currentUser.role].map(item=>
    `<div class="sb-item" data-view="${item.id}"><i class="ti ${item.icon}"></i>${item.label}</div>`
  ).join('');
  nav.querySelectorAll('.sb-item').forEach(el=>{
    el.addEventListener('click', ()=>{ navigate(el.dataset.view); document.getElementById('sidebar').classList.remove('open'); });
  });
}
async function navigate(view){
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('active', el.dataset.view===view));
  document.getElementById('tb-title').textContent = TITLES[view][0];
  document.getElementById('tb-sub').textContent = TITLES[view][1];
  const content = document.getElementById('content');
  content.innerHTML = '<div style="color:var(--ink-a65);font-size:13px">Loading…</div>';
  const renderers = {
    overview: renderAdminOverview, teachers: renderAdminTeachers, security: renderAdminSecurity,
    grade: renderTeacherGrade, students: renderTeacherStudents,
    results: renderStudentResults, settings: renderSettings
  };
  try{ await renderers[view](); }
  catch(e){
    if(e.message.includes('Session expired') || e.message.includes('Not signed in')) doLogout();
    else content.innerHTML = `<div class="card" style="color:var(--crimson);font-size:13px">${esc(e.message)}</div>`;
  }
}

// Large phone photos (often 8-15MB, 4000px+ wide) are the usual cause of upload
// timeouts on a slow connection. This resizes to a sane max dimension and re-encodes
// as JPEG before it ever leaves the browser — the AI reads handwriting fine well
// below original camera resolution, so this cuts upload size dramatically with no
// real loss in grading accuracy. PDFs pass through untouched (compressing those
// properly needs a different approach, not just a canvas resize).
async function compressImageFile(file, maxDim = 1800, quality = 0.82) {
  if (file.type === 'application/pdf') return file;
  const bitmap = await createImageBitmap(file).catch(() => null);
  if (!bitmap) return file; // fall back to original if decoding fails for any reason

  let { width, height } = bitmap;
  if (width > maxDim || height > maxDim) {
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);

  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
  if (!blob || blob.size >= file.size) return file; // keep original if compression didn't actually help
  return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
}

function setupUploadBox(boxId, inputId, kind){
  const box = document.getElementById(boxId);
  const input = document.getElementById(inputId);
  box.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async ()=>{
    const f = input.files[0];
    if(!f) return;
    if(f.size > 15*1024*1024){ showToast('File too large (max 15MB)', true); return; }
    box.querySelector('.ut').textContent = 'Compressing…';
    box.querySelector('.us').textContent = 'Please wait';
    const compressed = await compressImageFile(f);
    gradeFiles[kind] = compressed;
    box.classList.add('filled');
    box.querySelector('.ut').textContent = f.name.length>22 ? f.name.slice(0,20)+'…' : f.name;
    const savedPct = f.size > compressed.size ? Math.round((1 - compressed.size/f.size) * 100) : 0;
    box.querySelector('.us').textContent = savedPct > 5 ? `Ready · ${savedPct}% smaller` : 'Ready';
  });
}
let camStream = null;
function openCameraModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <div class="modal-h">Capture Answer Sheet <i class="ti ti-x modal-close" id="cam-close"></i></div>
      <video id="cam-video" class="cam-video" autoplay playsinline></video>
      <div class="cam-actions">
        <button class="btn" id="cam-shoot"><i class="ti ti-camera"></i>Capture</button>
        <button class="btn-outline" id="cam-cancel" style="width:auto;padding:12px 18px">Cancel</button>
      </div>
      <div class="errmsg" id="cam-err"></div>
    </div>`;
  document.body.appendChild(bg);
  const video = bg.querySelector('#cam-video');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false})
    .then(stream=>{ camStream = stream; video.srcObject = stream; })
    .catch(err=>{ bg.querySelector('#cam-err').textContent = 'Camera permission denied or unavailable: '+err.message; });
  function closeCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } bg.remove(); }
  bg.querySelector('#cam-close').addEventListener('click', closeCam);
  bg.querySelector('#cam-cancel').addEventListener('click', closeCam);
  bg.querySelector('#cam-shoot').addEventListener('click', ()=>{
    // Capture at native resolution, then run through the same compression path
    // as file uploads — phone camera streams can be very high-res.
    const canvas = document.getElementById('cam-canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    canvas.toBlob(async blob=>{
      const raw = new File([blob], 'camera-capture.jpg', {type:'image/jpeg'});
      const compressed = await compressImageFile(raw);
      gradeFiles.sheet = compressed;
      const box = document.getElementById('box-sheet');
      box.classList.add('filled');
      box.querySelector('.ut').textContent = 'Camera Capture';
      box.querySelector('.us').textContent = 'Ready';
      showToast('Answer sheet captured');
    }, 'image/jpeg', 0.92);
    closeCam();
  });
}
async function runGrading(){
  const btn = document.getElementById('grade-btn');
  const resultBox = document.getElementById('grade-result');
  if(!gradeFiles.sheet){ showToast('Upload or capture the answer sheet first', true); return; }
  const instructions = document.getElementById('grade-instructions').value.trim();
  const roll = document.getElementById('grade-roll').value.trim();
  const studentName = document.getElementById('grade-name').value.trim();
  const subject = document.getElementById('grade-subject').value.trim() || 'Exam';
  const examType = document.getElementById('grade-examtype').value.trim();

  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Grading…';
  resultBox.innerHTML = '<div class="card" style="text-align:center;color:var(--ink-a65);font-size:13px">Reading the answer sheet and comparing against the answer key… large multi-page sheets take longer and are processed page by page for reliability.</div>';
  try{
    const form = new FormData();
    if(gradeFiles.qb) form.append('qb', gradeFiles.qb);
    if(gradeFiles.key) form.append('key', gradeFiles.key);
    form.append('sheet', gradeFiles.sheet);
    form.append('instructions', instructions);
    form.append('subject', subject);
    form.append('rollNo', roll);
    form.append('studentName', studentName);
    form.append('examType', examType);
    const { result, pipeline, pageCount } = await api('/grade', { method:'POST', body: form });
    renderGradeResult(result, { subject, examType, studentName, rollNo: roll });
    if(pipeline === 'transcribed'){
      document.getElementById('grade-result').insertAdjacentHTML('afterbegin',
        `<div style="background:var(--crim-a10);border:1px solid var(--crim-a35);border-radius:6px;padding:10px 14px;font-size:11.5px;color:var(--ink);margin-bottom:12px">Large document (${pageCount} pages) — graded page-by-page for reliability rather than in one pass.</div>`);
    }
    if(roll) showToast('Result saved for roll '+roll.toUpperCase());
  }catch(e){
    resultBox.innerHTML = `<div class="card" style="color:var(--crimson);font-size:13px">Could not grade this sheet: ${esc(e.message)}</div>`;
  }finally{
    btn.disabled = false; btn.innerHTML = '<i class="ti ti-sparkles"></i>Grade With AI';
  }
}
function certHTML(r, meta){
  const pct = r.totalMarks ? Math.round((r.totalObtained/r.totalMarks)*100) : 0;
  const qHtml = (r.questions||[]).map(q=>`
    <div class="qrow"><div class="qrow-top"><span>Question ${esc(q.qNo)}</span><span>${q.obtained}/${q.outOf}</span></div><div class="qrow-fb">${esc(q.feedback||'')}</div></div>`).join('');
  const metaRow = (label, val) => val ? `<div><div class="cert-meta-label">${label}</div><div class="cert-meta-val">${esc(val)}</div></div>` : '';
  return `
    <div class="cert">
      <div class="cert-head">
        <div class="seal cert-seal"><span class="seal-mono">${pct}%</span></div>
        <div style="display:flex;gap:26px;flex-wrap:wrap">
          ${metaRow('Student', meta.studentName)}
          ${metaRow('Roll No.', meta.rollNo)}
          ${metaRow('Subject', meta.subject)}
          ${metaRow('Exam Type', meta.examType)}
        </div>
        <div style="text-align:right">
          <div class="cert-score">${r.totalObtained}<span>/${r.totalMarks}</span></div>
          <span class="badge ${r.passed?'g':'r'}">${r.passed?'Pass':'Fail'}</span>
        </div>
      </div>
      <div style="margin-top:16px;font-size:12.5px;color:var(--parch-a55);line-height:1.6">${esc(r.overallFeedback||'')}</div>
      <div style="margin-top:18px">${qHtml}</div>
    </div>`;
}
function renderGradeResult(r, meta){
  document.getElementById('grade-result').innerHTML = certHTML(r, meta);
}

async function renderStudentResults(){
  const { results } = await api('/student/results');
  const content = document.getElementById('content');
  if(results.length===0){ content.innerHTML = '<div class="card" style="text-align:center;color:var(--ink-a65);font-size:13px">No graded results yet.</div>'; return; }
  content.innerHTML = results.map(r=>certHTML(r, {
    subject: r.subject, examType: r.examType, studentName: r.studentName, rollNo: currentUser.rollNo
  }) + `<div style="text-align:right;font-size:10.5px;color:var(--ink-a65);margin:6px 0 16px;letter-spacing:.04em">${fmtTime(r.gradedAt)}</div>`).join('');
}

      <div class="okmsg" id="cp-ok"></div>
      <button class="btn" id="cp-save"><i class="ti ti-check"></i>Update Password</button>
    </div>`;
  document.getElementById('cp-save').addEventListener('click', async ()=>{
    const err = document.getElementById('cp-err'), ok = document.getElementById('cp-ok');
    err.textContent=''; ok.textContent='';

      await api('/auth/change-password', { method:'POST', body: JSON.stringify({
        currentPassword: document.getElementById('cp-cur').value, newPassword: newPwd

      ok.textContent = 'Password updated.';
      document.getElementById('cp-cur').value = document.getElementById('cp-new').value = document.getElementById('cp-conf').value = '';
    }catch(e){ err.textContent = e.message; }
  });
