services:
  - type: web
    name: scangrade-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: madhanadmin@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
